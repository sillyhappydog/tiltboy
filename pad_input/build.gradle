// Sumire Pad: game-controller text input engine.
// Pure Kotlin state machine (no Android classes) so it runs in plain JVM unit tests.
// It is an Android library only because it reuses the kana tables in :core.
plugins {
    id 'com.android.library'
}

android {
    namespace 'com.kazumaproject.pad_input'
    compileSdk = 37

    defaultConfig {
        minSdk 24
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(':core')
    // Amendment 6: the hold-role character transforms come from the touch tenkey's own table.
    implementation project(':tenkey')

    testImplementation 'junit:junit:4.13.2'
}
